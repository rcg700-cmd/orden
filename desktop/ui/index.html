<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <title>orden</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand"><span class="dot"></span>orden</div>
        <div class="path" id="rootPath">Ninguna carpeta seleccionada</div>
        <div class="badge hidden" id="configBadge"></div>
        <button class="btn ghost" id="pick">Elegir carpeta…</button>
      </header>

      <nav class="tabs hidden" id="tabs">
        <button class="tab active" data-tab="plan">Plan</button>
        <button class="tab" data-tab="dupes">Duplicados</button>
        <button class="tab" data-tab="rules">Reglas</button>
      </nav>

      <main class="main">
        <section class="empty" id="empty">
          <div class="empty-icon">▤</div>
          <h1>Ordena sin miedo</h1>
          <p>Elige una carpeta y verás el plan completo antes de mover nada.</p>
          <button class="btn primary" id="pick2">Elegir carpeta…</button>
        </section>

        <section class="hidden" id="content">
          <div class="cards" id="cards"></div>
          <div id="list"></div>
        </section>

        <section class="hidden view" id="dupesView">
          <div class="view-head">
            <h2>Duplicados</h2>
            <p>Mismo tamaño y mismo SHA-256. Solo se informa: aquí no se borra nada.</p>
          </div>
          <div class="view-controls">
            <label class="field">
              <span>Tamaño mínimo</span>
              <select id="dupeMinSize">
                <option value="0">Cualquiera</option>
                <option value="102400">100 KB</option>
                <option value="1048576" selected>1 MB</option>
                <option value="10485760">10 MB</option>
              </select>
            </label>
            <button class="btn primary" id="dupeScan">Buscar duplicados</button>
            <span class="muted" id="dupeSummary"></span>
          </div>
          <div id="dupeList"></div>
        </section>

        <section class="hidden view" id="rulesView">
          <div class="view-head">
            <h2>Reglas</h2>
            <p>Gana la primera regla que coincida. Se guardan en <code>orden.config.json</code>.</p>
          </div>
          <div class="view-controls">
            <label class="check">
              <input type="checkbox" id="includeHidden" />
              <span>Incluir archivos ocultos</span>
            </label>
            <label class="field grow">
              <span>Ignorar patrones</span>
              <input id="ignorePatterns" class="input mono" placeholder="node_modules/**, *.tmp" />
            </label>
          </div>
          <div id="rulesList"></div>
          <div class="rules-actions">
            <button class="btn ghost" id="addRule">Añadir regla</button>
            <span class="spacer"></span>
            <button class="btn ghost" id="rulesReload">Descartar cambios</button>
            <button class="btn primary" id="rulesSave">Guardar reglas</button>
          </div>
          <p class="hint" id="rulesFile"></p>
        </section>
      </main>

      <footer class="statusbar" id="statusbar">
        <label class="check">
          <input type="checkbox" id="selectAll" />
          <span>Seleccionar todo</span>
        </label>
        <span class="muted" id="selection">0 seleccionados</span>
        <span class="spacer"></span>
        <button class="btn ghost" id="undo" disabled>Deshacer</button>
        <button class="btn primary" id="apply" disabled>Aplicar</button>
      </footer>
    </div>

    <div class="modal hidden" id="modal">
      <div class="modal-box" role="dialog" aria-modal="true">
        <h2 id="modalTitle"></h2>
        <p id="modalBody"></p>
        <div class="modal-actions">
          <button class="btn ghost" id="modalCancel">Cancelar</button>
          <button class="btn primary" id="modalOk">Confirmar</button>
        </div>
      </div>
    </div>

    <div class="toast hidden" id="toast"></div>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
